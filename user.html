<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; background-color: #f4f4f4;">

    <!-- Top Header -->
    <div style="background: #007BFF; color: white; padding: 15px; display: flex; justify-content: space-between;">
        <h2>Student Portal (ST-1001)</h2>
        <a href="index.html" style="color: white; text-decoration: none; padding-top: 5px;">Logout</a>
    </div>

    <div style="padding: 20px;">
        <h3>My Attendance Overview</h3>
        
        <!-- Stats Box -->
        <div style="display: flex; gap: 20px; margin-bottom: 20px;">
            <div style="background: white; padding: 15px; flex: 1; border-radius: 5px;">
                <h4>Overall Attendance</h4>
                <p style="font-size: 24px; color: #007BFF;">92.5%</p>
            </div>
            <div style="background: white; padding: 15px; flex: 1; border-radius: 5px;">
                <h4>Classes Attended</h4>
                <p style="font-size: 24px; color: green;">74 / 80</p>
            </div>
        </div>

        <!-- Subject Table -->
        <div style="background: white; padding: 20px; border-radius: 5px;">
            <h3>Subject-wise Breakdown</h3>
            <table border="1" width="100%" style="border-collapse: collapse; margin-top: 10px; text-align: left;">
                <tr style="background: #eee;">
                    <th style="padding: 10px;">Subject Name</th>
                    <th style="padding: 10px;">Attended / Total</th>
                    <th style="padding: 10px;">Percentage</th>
                </tr>
                <tr>
                    <td style="padding: 10px;">Artificial Intelligence</td>
                    <td style="padding: 10px;">24 / 25</td>
                    <td style="padding: 10px; color: green;">96.0%</td>
                </tr>
                <tr>
                    <td style="padding: 10px;">Data Structures</td>
                    <td style="padding: 10px;">20 / 22</td>
                    <td style="padding: 10px; color: green;">90.9%</td>
                </tr>
            </table>
        </div>
    </div>

</body>
</html>
