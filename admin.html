<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; background-color: #f4f4f4;">

    <!-- Top Header -->
    <div style="background: #333; color: white; padding: 15px; display: flex; justify-content: space-between;">
        <h2>Admin Panel</h2>
        <a href="index.html" style="color: white; text-decoration: none; padding-top: 5px;">Logout</a>
    </div>

    <div style="padding: 20px;">
        <h3>Welcome, Admin</h3>
        
        <!-- Stats Box -->
        <div style="display: flex; gap: 20px; margin-bottom: 20px;">
            <div style="background: white; padding: 15px; flex: 1; border-radius: 5px;">
                <h4>Total Students</h4>
                <p style="font-size: 24px; color: #007BFF;">1,240</p>
            </div>
            <div style="background: white; padding: 15px; flex: 1; border-radius: 5px;">
                <h4>Present Today</h4>
                <p style="font-size: 24px; color: green;">1,120</p>
            </div>
            <div style="background: white; padding: 15px; flex: 1; border-radius: 5px;">
                <h4>Absent Today</h4>
                <p style="font-size: 24px; color: red;">120</p>
            </div>
        </div>

        <!-- Student Records Table -->
        <div style="background: white; padding: 20px; border-radius: 5px;">
            <h3>Student Attendance List</h3>
            <table border="1" width="100%" style="border-collapse: collapse; margin-top: 10px; text-align: left;">
                <tr style="background: #eee;">
                    <th style="padding: 10px;">Name</th>
                    <th style="padding: 10px;">ID</th>
                    <th style="padding: 10px;">Status</th>
                </tr>
                <tr>
                    <td style="padding: 10px;">Alex Johnson</td>
                    <td style="padding: 10px;">ST-1001</td>
                    <td style="padding: 10px; color: green;">Present</td>
                </tr>
                <tr>
                    <td style="padding: 10px;">Sarah Smith</td>
                    <td style="padding: 10px;">ST-1002</td>
                    <td style="padding: 10px; color: red;">Absent</td>
                </tr>
            </table>
        </div>
    </div>

</body>
</html>
